name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q alerts.py hook_config.py manage.py scripts tests
      - name: Isolated installation and uninstall
        shell: powershell
        run: |
          $pythonExe = (python -c 'import sys; print(sys.executable)').Trim()
          .\tests\integration.ps1 -PythonExe $pythonExe
      - name: Build source archive
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-python-${{ matrix.python }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
